<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="LiZi Life，记录健康、训练与每一天的进展。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>LiZi Life · 个人状态站</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./framework7-bundle.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="app">
  <div class="view view-main" id="app-shell">
    <div class="page">
      <header class="navbar life-navbar">
        <div class="navbar-bg"></div>
        <div class="navbar-inner">
          <div class="left"><a class="brand external" href="#today"><img src="./icon-192.png" alt=""><span>LiZi Life</span></a></div>
          <div class="right header-actions">
            <button id="sync-button" class="sync-status" aria-label="同步记录"><span class="sync-dot" aria-hidden="true"></span><span id="save-state" role="status" aria-live="polite">仅本机</span></button>
            <button class="icon-button" id="import-health-button" data-action="import-health" aria-label="导入健康ZIP" title="导入健康ZIP" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></svg></button>
            <button class="icon-button" id="settings-button" hidden aria-label="打开设置"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2m0-14-2 2M7 17l-2 2"/><circle cx="12" cy="12" r="7"/></svg></button>
          </div>
        </div>
      </header>
      <div class="toolbar tabbar tabbar-icons toolbar-bottom life-tabbar">
        <nav id="mobile-nav" class="toolbar-inner" aria-label="主导航"></nav>
      </div>
      <div id="page-scroll" class="page-content ptr-content" data-ptr-distance="72">
        <div class="ptr-preloader"><div class="preloader"></div><div class="ptr-arrow"></div></div>
        <div class="life-content">
          <label id="date-control" class="date-control"><span id="date-label"></span><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><path d="m3 4.5 3 3 3-3"/></svg><input id="selected-date" type="date" aria-label="记录日期"></label>
          <section id="update-banner" hidden role="status"><span>新版本已就绪</span><button id="apply-update" class="text-button">立即更新</button></section>
          <main id="main"></main>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="sr-only" role="status" aria-live="polite"></div>
  <dialog id="modal" class="popup life-popup" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><button id="close-modal" class="text-button" aria-label="取消并关闭">取消</button><h2 id="modal-title" tabindex="-1"></h2><button id="modal-save" class="text-button modal-save" hidden>保存</button></div>
    <div id="modal-body"></div>
  </dialog>
  <input hidden id="json-file" type="file" accept="application/json,.json">
</div>
<script src="./framework7-bundle.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
